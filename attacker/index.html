<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YusufxonPro - Elite Cyber Security & Pentest Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #02040a; color: #00ff66; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        header { background: #0b0f19; border-bottom: 2px solid #00ff66; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1rem; text-shadow: 0 0 8px #00ff66; color: #38bdf8; }
        .status { font-size: 0.75rem; color: #34d399; }
        
        .toolbar { background: #060913; padding: 6px 20px; display: flex; gap: 6px; border-bottom: 1px solid #1e293b; flex-wrap: wrap; }
        .tool-btn { background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 10px; font-size: 0.7rem; cursor: pointer; border-radius: 3px; transition: 0.2s; }
        .tool-btn:hover { background: #38bdf8; color: #02040a; }
        
        #terminal-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .output-line { margin-bottom: 5px; line-height: 1.3; white-space: pre-wrap; word-break: break-all; font-size: 0.85rem; }
        .error { color: #f87171; }
        .success { color: #34d399; }
        .warning { color: #fbbf24; }
        .info { color: #94a3b8; }
        .cyan { color: #38bdf8; }
        .purple { color: #c084fc; }

        /* Report & Preview box */
        .report-box { border: 1px solid #38bdf8; background: #080f1e; padding: 10px; margin: 8px 0; border-radius: 4px; }
        .report-header { color: #38bdf8; font-weight: bold; border-bottom: 1px solid #1e293b; padding-bottom: 4px; margin-bottom: 6px; }

        #input-box { background: #060913; border-top: 1px solid #1e293b; padding: 12px 20px; display: flex; align-items: center; }
        .prompt-symbol { color: #34d399; font-weight: bold; margin-right: 8px; }
        #command-input { flex: 1; background: transparent; border: none; color: #00ff66; font-size: 0.95rem; outline: none; font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body>

    <header>
        <h1>YusufxonPro Pentest OS v4.2 [Root Access Granted]</h1>
        <div class="status">● TARGET_SCANNER: ACTIVE</div>
    </header>

    <div class="toolbar">
        <button class="tool-btn" onclick="runCmd('help')">help</button>
        <button class="tool-btn" onclick="runCmd('scan kun.uz')">scan kun.uz</button>
        <button class="tool-btn" onclick="runCmd('dirsearch uzum.uz')">dirsearch uzum.uz</button>
        <button class="tool-btn" onclick="runCmd('admin-finder site.uz')">admin-finder</button>
        <button class="tool-btn" onclick="runCmd('clear')">clear</button>
    </div>

    <div id="terminal-container">
        <div class="output-line info">YusufxonPro Security Framework ishga tushdi. Saytlarni chuqur tahlil qilish uchun buyruq kiriting.</div>
        <div class="output-line info">Masalan: <span class="cyan">scan [domen]</span> yoki <span class="cyan">dirsearch [domen]</span></div>
        <br>
    </div>

    <div id="input-box">
        <span class="prompt-symbol">root@yusufxonpro-sec:~#</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        const terminal = document.getElementById('terminal-container');
        const input = document.getElementById('command-input');

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = input.value.trim();
                if (cmd) {
                    printOutput("root@yusufxonpro-sec:~# " + cmd, "info");
                    handleCommand(cmd);
                    input.value = '';
                }
            }
        });

        function runCmd(cmdStr) {
            printOutput("root@yusufxonpro-sec:~# " + cmdStr, "info");
            handleCommand(cmdStr);
        }

        function printOutput(text, type = "success") {
            const div = document.createElement('div');
            div.className = `output-line ${type}`;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function printHtml(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function simulateProgress(steps, callback) {
            let i = 0;
            function next() {
                if (i < steps.length) {
                    printOutput(steps[i], "warning");
                    i++;
                    setTimeout(next, 250);
                } else {
                    callback();
                }
            }
            next();
        }

        function handleCommand(fullCmd) {
            const parts = fullCmd.split(' ');
            const cmd = parts[0].toLowerCase();
            const target = parts[1] || 'target-system.uz';

            if (cmd === 'clear') {
                terminal.innerHTML = '';
                return;
            }

            if (cmd === 'help') {
                printOutput("Mavjud hakerlik va tahlil buyruqlari:", "success");
                printOutput("  scan [domen]          - Saytning portlari, SSL va sarlavhalarini to'liq skanerlash");
                printOutput("  dirsearch [domen]     - Yashirin papkalar va fayllarni topish (Gobuster moduli)");
                printOutput("  admin-finder [domen]  - Yashirin admin panel va login sahifalarini qidirish");
                printOutput("  clear                 - Ekranni tozalash");
                return;
            }

            if (cmd === 'scan') {
                simulateProgress([
                    `[+] [1/4] Target halokatli nuqtalari qidirilmoqda: ${target}...`,
                    `[+] [2/4] TCP portlar skanerlanmoqda (80, 443, 22, 3306, 8080)...`,
                    `[+] [3/4] SSL/TLS sertifikat imzolari va shifrlash tahlili bajarilmoqda...`,
                    `[+] [4/4] Xavfsizlik sarlavhalari (Headers) tekshirilmoqda...`
                ], () => {
                    printHtml(`
                        <div class="report-box">
                            <div class="report-header">🛡️ VULNERABILITY AUDIT REPORT: ${target.toUpperCase()}</div>
                            <div class="output-line success">[-] Status: Target faol va ochiq portlar aniqlandi.</div>
                            <div class="output-line error">[-] Aniqolangan zaifliklar (Vulnerabilities):</div>
                            <div class="output-line warning">  • X-Frame-Options: MAVJUD EMAS (Clickjacking xavfi yuqori)</div>
                            <div class="output-line warning">  • Server Header: nginx/1.18.0 (Eskirgan versiya oshkor bo'lmoqda)</div>
                            <div class="output-line error">  • CORS Policy: Access-Control-Allow-Origin: * (Ma'lumot sizishi mumkin)</div>
                            <div class="output-line cyan">[-] Tavsiya: Sarlavhalarni to'g'rilang va server versiyasini yashiring.</div>
                        </div>
                    `);
                });
                return;
            }

            if (cmd === 'dirsearch') {
                simulateProgress([
                    `[*] Wordlist yuklandi: common_paths.txt (2500 ta so'z)`,
                    `[*] Fuzzing jarayoni boshlandi: https://${target}/ ...`,
                    `[+] 200 - OK - /index.php`,
                    `[+] 301 - Moved - /assets/`,
                    `[+] 200 - OK - /robots.txt`,
                    `[+] 403 - Forbidden - /admin/`
                ], () => {
                    printHtml(`
                        <div class="report-box">
                            <div class="report-header">📁 DIRSEARCH / HIDDEN PATHS FOUND: ${target.toUpperCase()}</div>
                            <div class="output-line success">  [200] https://${target}/robots.txt</div>
                            <div class="output-line success">  [200] https://${target}/sitemap.xml</div>
                            <div class="output-line warning">  [301] https://${target}/backup/ (Folder topildi!)</div>
                            <div class="output-line error">  [200] https://${target}/config.json.bak (DIQQAT: Zaxira fayl ochiq!)</div>
                            <div class="output-line cyan">  [403] https://${target}/administrator/ (Admin kirish joyi)</div>
                        </div>
                    `);
                });
                return;
            }

            if (cmd === 'admin-finder') {
                simulateProgress([
                    `[~] Admin panel qidirish algoritmi ishga tushdi...`,
                    `[~] /admin, /login, /wp-admin, /dashboard tekshirilmoqda...`
                ], () => {
                    printHtml(`
                        <div class="report-box">
                            <div class="report-header">🔑 ADMIN PANEL DISCOVERY: ${target.toUpperCase()}</div>
                            <div class="output-line success">  [TOPILDI] https://${target}/admin/login.php</div>
                            <div class="output-line success">  [TOPILDI] https://${target}/auth/signin</div>
                            <div class="output-line warning">  [OGOHLANTIRISH] Brute-force himoyasi (Captcha) o'rnatilmagan!</div>
                        </div>
                    `);
                });
                return;
            }

            printOutput(`Xato: '${cmd}' buyruqi topilmadi. Yordam uchun 'help' deb yozing.`, "error");
        }
    </script>
</body>
</html>
