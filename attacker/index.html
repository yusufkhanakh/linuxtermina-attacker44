<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YusufxonPro Elite Security OS v8.1 [1-4MB Heavy Dump]</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #010409; color: #00ff66; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #010409; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .auth-box { border: 2px solid #00ff66; background: #0d1117; padding: 30px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 0 20px rgba(0,255,102,0.3); }
        .auth-box h2 { color: #38bdf8; font-size: 1.1rem; margin-bottom: 15px; text-align: center; }
        .auth-input { width: 100%; background: #010409; border: 1px solid #30363d; color: #00ff66; padding: 10px; margin: 10px 0; font-family: monospace; outline: none; border-radius: 4px; }
        .auth-btn { width: 100%; background: #238636; color: #fff; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }
        .auth-btn:hover { background: #2ea043; }

        header { background: #0d1117; border-bottom: 2px solid #00ff66; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 0.9rem; text-shadow: 0 0 8px #00ff66; color: #38bdf8; }
        .status { font-size: 0.75rem; color: #34d399; }
        
        .toolbar { background: #161b22; padding: 6px 20px; display: flex; gap: 6px; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
        .tool-btn { background: #21262d; border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 8px; font-size: 0.65rem; cursor: pointer; border-radius: 3px; transition: 0.2s; }
        .tool-btn:hover { background: #38bdf8; color: #010409; }
        
        #terminal-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; scroll-behavior: smooth; display: none; }
        .output-line { margin-bottom: 5px; line-height: 1.3; white-space: pre-wrap; word-break: break-all; font-size: 0.85rem; }
        .error { color: #f87171; }
        .success { color: #34d399; }
        .warning { color: #fbbf24; }
        .info { color: #8b949e; }
        .cyan { color: #38bdf8; }
        a { color: #38bdf8; text-decoration: underline; }

        .report-box { border: 1px solid #38bdf8; background: #0d1117; padding: 12px; margin: 8px 0; border-radius: 6px; }
        .report-header { color: #38bdf8; font-weight: bold; border-bottom: 1px solid #30363d; padding-bottom: 4px; margin-bottom: 6px; }

        #suggestions { position: absolute; bottom: 55px; left: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 4px; display: none; max-height: 120px; overflow-y: auto; z-index: 10; width: 300px; }
        .suggestion-item { padding: 6px 10px; font-size: 0.8rem; color: #8b949e; cursor: pointer; }
        .suggestion-item:hover { background: #21262d; color: #00ff66; }

        #input-box { background: #161b22; border-top: 1px solid #30363d; padding: 12px 20px; display: flex; align-items: center; display: none; position: relative; }
        .prompt-symbol { color: #34d399; font-weight: bold; margin-right: 8px; }
        #command-input { flex: 1; background: transparent; border: none; color: #00ff66; font-size: 0.95rem; outline: none; font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2>🔒 YUSUFXONPRO XAVFSIZLIK TIZIMI</h2>
            <div style="font-size: 0.75rem; color: #8b949e; margin-bottom: 10px; text-align: center;">Parolni kiriting (Parol: root)</div>
            <input type="password" id="auth-pass" class="auth-input" placeholder="Parolni kiriting..." autofocus>
            <button class="auth-btn" onclick="authenticate()">TIZIMGA KIRISH</button>
            <div id="auth-error" style="color: #f87171; font-size: 0.75rem; text-align: center; margin-top: 8px;"></div>
        </div>
    </div>

    <header>
        <h1>YusufxonPro Professional Pentest OS [1-4MB Heavy Dump]</h1>
        <div class="status">● ROOT_HUQUQI: FAOL</div>
    </header>

    <div class="toolbar">
        <button class="tool-btn" onclick="runCmd('yordam')">yordam</button>
        <button class="tool-btn" onclick="runCmd('scan constitution.uz')">constitution.uz tahlili</button>
        <button class="tool-btn" onclick="runCmd('sqlmap emaktab.uz')">emaktab.uz sqlmap</button>
        <button class="tool-btn" onclick="runCmd('dump emaktab.uz')">baza dump</button>
        <button class="tool-btn" onclick="runCmd('gallery-grab uzum.uz')">rasmlarni tortish</button>
        <button class="tool-btn" onclick="runCmd('tozalash')">tozalash</button>
    </div>

    <div id="terminal-container">
        <div class="output-line info">Linux yusufxonpro-sec 6.8.0-elite-kernel [Og'ir ma'lumotlar bazasi rejimi]</div>
        <div class="output-line info">Barcha hisobotlar endi 1 MB - 4 MB hajmda yaratiladi.</div>
        <br>
    </div>

    <div id="input-box">
        <div id="suggestions"></div>
        <span class="prompt-symbol">root@yusufxonpro-sec:~#</span>
        <input type="text" id="command-input" autocomplete="off" spellcheck="false">
    </div>

    <script>
        const authScreen = document.getElementById('auth-screen');
        const terminalContainer = document.getElementById('terminal-container');
        const inputBox = document.getElementById('input-box');
        const terminal = document.getElementById('terminal-container');
        const input = document.getElementById('command-input');
        const authPass = document.getElementById('auth-pass');
        const authError = document.getElementById('auth-error');
        const suggestionsBox = document.getElementById('suggestions');

        let pendingDownload = null;

        const availableCommands = [
            'yordam', 'scan', 'sqlmap', 'dirsearch', 'nikto', 
            'dump', 'gallery-grab', 'brute', 'payload', 'audit', 'tozalash'
        ];

        function authenticate() {
            const pass = authPass.value.trim();
            if (pass === 'root' || pass === 'admin' || pass === 'yusufxon') {
                authScreen.style.display = 'none';
                terminalContainer.style.display = 'flex';
                inputBox.style.display = 'flex';
                input.focus();
            } else {
                authError.textContent = "[-] Xato parol! (Parol: root)";
            }
        }

        authPass.addEventListener('keydown', (e) => { if (e.key === 'Enter') authenticate(); });

        input.addEventListener('input', () => {
            if (pendingDownload !== null) return;
            const val = input.value.trim().toLowerCase();
            if (!val) { suggestionsBox.style.display = 'none'; return; }
            const filtered = availableCommands.filter(c => c.startsWith(val));
            if (filtered.length > 0 && val !== filtered[0]) {
                suggestionsBox.innerHTML = filtered.map(f => `<div class="suggestion-item" onclick="selectSuggestion('${f}')">${f} [domen]</div>`).join('');
                suggestionsBox.style.display = 'block';
            } else { suggestionsBox.style.display = 'none'; }
        });

        function selectSuggestion(cmd) {
            input.value = cmd + ' ';
            suggestionsBox.style.display = 'none';
            input.focus();
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = input.value.trim();
                suggestionsBox.style.display = 'none';
                if (cmd) {
                    printOutput("root@yusufxonpro-sec:~# " + cmd, "info");
                    handleCommand(cmd);
                    input.value = '';
                }
            }
        });

        function runCmd(cmdStr) {
            printOutput("root@yusufxonpro-sec:~# " + cmdStr, "info");
            handleCommand(cmdStr);
        }

        function printOutput(text, type = "success") {
            const div = document.createElement('div');
            div.className = `output-line ${type}`;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function printHtml(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // 1 MB - 4 MB hajmdagi real og'ir faylni yaratish funksiyasi
        function downloadFileToPC(filename, content) {
            let heavyContent = content + "\n\n--- HEAVY DATABASE RECORDS DUMP (1MB - 4MB) ---\n";
            for (let i = 1; i <= 35000; i++) {
                let r = Math.random().toString(36).substring(2);
                heavyContent += `[ROW #${i}] user_id: ${30000+i} | username: client_${r} | pass_hash: $2y$10$${r}${r} | email: user_${i}@gov.uz | ip_address: 192.168.${i%255}.${i%200} | status: active\n`;
            }
            const blob = new Blob([heavyContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function requestDownload(filename, content) {
            pendingDownload = { filename, content };
            printHtml(`
                <div class="report-box" style="border-color: #fbbf24;">
                    <div class="report-header" style="color: #fbbf24;">⚠️ OG'IR BAZA FAYLINI YUKLAB OLISH (1-4 MB)</div>
                    <div class="output-line warning">[?] Ushbu katta hajmli bazani ("${filename}") kompyuterga yuklab olasizmi?</div>
                    <div class="output-line success">Javob bering: <span class="cyan">ha</span> yoki <span class="error">yo'q</span></div>
                </div>
            `);
        }

        function simulateProgress(steps, callback) {
            let i = 0;
            function next() {
                if (i < steps.length) {
                    printOutput(steps[i], "warning");
                    i++;
                    setTimeout(next, 150);
                } else {
                    callback();
                }
            }
            next();
        }

        function handleCommand(fullCmd) {
            const cmdLower = fullCmd.toLowerCase().trim();

            if (pendingDownload !== null) {
                if (cmdLower === 'ha' || cmdLower === 'h') {
                    downloadFileToPC(pendingDownload.filename, pendingDownload.content);
                    printOutput(`[+] "${pendingDownload.filename}" (Hajmi ~2-4 MB) kompyuterga muvaffaqiyatli yuklab olindi!`, "success");
                    pendingDownload = null;
                } else if (cmdLower === "yo'q" || cmdLower === 'yoq' || cmd_lower === 'y') {
                    printOutput(`[-] Yuklab olish bekor qilindi.`, "warning");
                    pendingDownload = null;
                } else {
                    printOutput(`[!] Noto'g'ri javob. Iltimos, 'ha' yoki 'yo'q' deb yozing:`, "error");
                }
                return;
            }

            const parts = fullCmd.split(' ');
            const cmd = parts[0].toLowerCase();
            const target = parts[1] || 'emaktab.uz';
            const targetUrl = target.startsWith('http') ? target : `https://${target}`;

            if (cmd === 'tozalash' || cmd === 'clear') {
                terminal.innerHTML = '';
                return;
            }

            if (cmd === 'yordam' || cmd === 'help') {
                printOutput("================ HAKERLIK BUYRUQLARI ================", "success");
                printOutput("  scan, sqlmap, dirsearch, nikto, dump, gallery-grab, tozalash");
                return;
            }

            if (cmd === 'scan' || cmd === 'sqlmap' || cmd === 'dump' || cmd === 'gallery-grab' || cmd === 'payload') {
                simulateProgress([
                    `[+] Modul ishga tushdi va ${target} nishonga olindi...`,
                    `[+] Ma'lumotlar bazasi va jadvallar yig'ilmoqda (1-4 MB)...`
                ], () => {
                    const reportText = `[OG'IR DUMP HISOBOTI - ${target.toUpperCase()}]\nTarget: ${targetUrl}\nHolat: Ma'lumotlar bazasi to'liq tortib olindi.\nJadvallar: admins, users, logs`;
                    requestDownload(`baza_ogir_dump_${target.replace('.','_')}.txt`, reportText);
                });
                return;
            }

            printOutput(`Xato: '${cmd}' topilmadi. 'yordam' deb yozing.`, "error");
        }
    </script>
</body>
</html>
