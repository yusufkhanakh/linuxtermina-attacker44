<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YusufxonPro - Professional Cybersecurity & Audit Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #050505; color: #00ff66; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        header { background: #111; border-bottom: 2px solid #00ff66; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.1rem; text-shadow: 0 0 10px #00ff66; }
        .status { font-size: 0.8rem; color: #00ffff; }
        
        .toolbar { background: #0a0a0a; padding: 8px 20px; display: flex; gap: 8px; border-bottom: 1px solid #222; flex-wrap: wrap; }
        .tool-btn { background: #151515; border: 1px solid #00ff66; color: #00ff66; padding: 5px 12px; font-size: 0.75rem; cursor: pointer; border-radius: 3px; transition: 0.2s; }
        .tool-btn:hover { background: #00ff66; color: #000; }
        
        #terminal-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .output-line { margin-bottom: 8px; line-height: 1.4; white-space: pre-wrap; word-break: break-all; font-size: 0.9rem; }
        .error { color: #ff4444; }
        .success { color: #00ffff; }
        .warning { color: #ffaa00; }
        .info { color: #ffffff; }
        
        #input-box { background: #080808; border-top: 1px solid #222; padding: 15px 20px; display: flex; align-items: center; }
        .prompt-symbol { color: #00ff66; font-weight: bold; margin-right: 10px; }
        #command-input { flex: 1; background: transparent; border: none; color: #00ff66; font-size: 1rem; outline: none; font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body>

    <header>
        <h1>YusufxonPro // CYBERSECURITY PENETRATION & AUDIT TERMINAL</h1>
        <div class="status">● ETHICAL_MODE_ACTIVE</div>
    </header>

    <div class="toolbar">
        <button class="tool-btn" onclick="runPreset('help')">help</button>
        <button class="tool-btn" onclick="runPreset('audit example.com')">audit target</button>
        <button class="tool-btn" onclick="runPreset('nmap example.com')">nmap scan</button>
        <button class="tool-btn" onclick="runPreset('sqlmap -u example.com')">sqlmap audit</button>
        <button class="tool-btn" onclick="runPreset('nikto -h example.com')">nikto headers</button>
        <button class="tool-btn" onclick="runPreset('clear')">clear</button>
    </div>

    <div id="terminal-container">
        <div class="output-line info">YusufxonPro Security OS [Version 2026.4.1 - Ethical Penetration Testing Suite]</div>
        <div class="output-line info">Saytlarning zaif tomonlarini (vulnerabilities) aniqlash uchun buyruq kiriting. Masalan: <span style="color:#00ff66">audit uzum.uz</span></div>
        <br>
    </div>

    <div id="input-box">
        <span class="prompt-symbol">root@yusufxonpro:~#</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        const terminal = document.getElementById('terminal-container');
        const input = document.getElementById('command-input');
        let commandsConfig = {};

        // JSON ma'lumotlar bazasini yuklash
        fetch('commands.json')
            .then(res => res.json())
            .then(data => { commandsConfig = data; })
            .catch(err => { console.log("JSON config yuklandi."); });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = input.value.trim();
                if (cmd) {
                    printOutput("root@yusufxonpro:~# " + cmd, "info");
                    processCommand(cmd);
                    input.value = '';
                }
            }
        });

        function runPreset(cmdStr) {
            printOutput("root@yusufxonpro:~# " + cmdStr, "info");
            processCommand(cmdStr);
        }

        function printOutput(text, type = "success") {
            const div = document.createElement('div');
            div.className = `output-line ${type}`;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function simulateProgress(steps, callback) {
            let i = 0;
            function nextStep() {
                if (i < steps.length) {
                    printOutput(steps[i], "warning");
                    i++;
                    setTimeout(nextStep, 350);
                } else {
                    callback();
                }
            }
            nextStep();
        }

        function processCommand(fullCmd) {
            const parts = fullCmd.split(' ');
            const cmd = parts[0].toLowerCase();
            const target = parts[1] || 'target-domain.com';

            if (cmd === 'clear') {
                terminal.innerHTML = '';
                return;
            }

            if (cmd === 'help') {
                printOutput("Mavjud xavfsizlik va audit buyruqlari:", "success");
                printOutput("  audit [domen]    - Veb-sayt xavfsizligini kompleks tekshirish");
                printOutput("  nmap [domen]     - Ochiq portlar va xizmatlarni aniqlash");
                printOutput("  sqlmap [domen]   - Ma'lumotlar bazasi injeksiya nuqtalarini qidirish");
                printOutput("  nikto [domen]    - Server xavfsizlik sarlavhalari va xatolarini tekshirish");
                printOutput("  clear            - Ekranni tozalash");
                return;
            }

            if (cmd === 'audit') {
                simulateProgress([
                    `[+] [1/4] Target tahlil qilinmoqda: ${target}...`,
                    `[+] [2/4] DNS yozuvlari va SSL sertifikat holati tekshirilmoqda...`,
                    `[+] [3/4] HTTP sarlavhalari (Security Headers) tahlili bajarilmoqda...`,
                    `[+] [4/4] Zaifliklar hisoboti /var/reports/ papkasiga yozilmoqda...`
                ], () => {
                    printOutput(`\n[AUDIT HISOBOTI - ${target.toUpperCase()}]`, "success");
                    printOutput(` - Xavfsizlik darajasi: O'rtacha (Moderate Risk)`);
                    printOutput(` - Aniqlangan kamchiliklar:`, "error");
                    printOutput(`   1. HSTS (Strict-Transport-Security) sarlavhasi topilmadi.`);
                    printOutput(`   2. Server versiyasi oshkor bo'lmoqda (Nginx).`);
                    printOutput(` - Tavsiya: Yuqoridagi sarlavhalarni qo'shish va server versiyasini yashirish kerak.`, "warning");
                });
                return;
            }

            if (cmd === 'nmap') {
                simulateProgress([
                    `[+] Nmap skaneri ishga tushdi: ${target}...`,
                    `[+] TCP portlari tekshirilmoqda...`
                ], () => {
                    printOutput(`PORT     STATE SERVICE\n80/tcp   open  http\n443/tcp  open  https\n22/tcp   open  ssh\n[NATIJA] Skanerlash muvaffaqiyatli yakunlandi.`, "success");
                });
            } else if (cmd === 'sqlmap') {
                simulateProgress([
                    `[~] SQLMap tamper va payloadlar tayyorlanmoqda...`,
                    `[~] Parametrlar fuzzing qilinmoqda...`
                ], () => {
                    printOutput(`[NATIJA] Targetda SQL injection zaifligi topilmadi. Himoya faol.`, "success");
                });
            } else if (cmd === 'nikto') {
                simulateProgress([
                    `[+] Nikto veb-skaneri ishga tushdi (${target})...`,
                    `[+] Konfiguratsiya xatolari tekshirilmoqda...`
                ], () => {
                    printOutput(`[OGOHLANTIRISH] Clickjacking qarshi himoya (X-Frame-Options) o'rnatilmagan.`, "warning");
                });
            } else {
                printOutput(`Xato: '${cmd}' buyruqi topilmadi. Yordam uchun 'help' deb yozing.`, "error");
            }
        }
    </script>
</body>
</html>
